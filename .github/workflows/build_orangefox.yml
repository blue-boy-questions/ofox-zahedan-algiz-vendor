name: Build OrangeFox R11.3 / fox_14.1 (Volla Quintus Kernel 6.6)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'OrangeFox Manifest Branch (14.1 recommended for Kernel 6.6 / Android 14-16)'
        required: true
        default: '14.1'
      stock_vendor_boot_url:
        description: 'Direct Download URL or Google Drive link for Kernel 6.6 stock_vendor_boot.img'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space (Free ~90GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout Repository (Device Tree & Scripts)
        uses: actions/checkout@v4
        with:
          path: tree_repo

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git aria2 rsync curl wget lz4 zip unzip python3 python3-pip bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zlib1g-dev
          pip3 install gdown

      - name: Configure Git
        run: |
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@orangefox.tech"

      - name: Sync OrangeFox Minimal Manifest (${{ github.event.inputs.manifest_branch }})
        run: |
          mkdir -p ~/OrangeFox_sync ~/fox_${{ github.event.inputs.manifest_branch }}
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch ${{ github.event.inputs.manifest_branch }} --path ~/fox_${{ github.event.inputs.manifest_branch }}

      - name: Populate Device Tree (device/volla/algiz)
        run: |
          mkdir -p ~/fox_${{ github.event.inputs.manifest_branch }}/device/volla/algiz
          cp -r tree_repo/device/volla/algiz/* ~/fox_${{ github.event.inputs.manifest_branch }}/device/volla/algiz/
          if [ -f "tree_repo/stock_vendor_boot.img" ]; then
            python3 tree_repo/setup_device_tree_from_zero.py --stock tree_repo/stock_vendor_boot.img --tree ~/fox_${{ github.event.inputs.manifest_branch }}/device/volla/algiz
          elif [ -n "${{ github.event.inputs.stock_vendor_boot_url }}" ]; then
            gdown --fuzzy "${{ github.event.inputs.stock_vendor_boot_url }}" -O /tmp/stock_vendor_boot.img
            python3 tree_repo/setup_device_tree_from_zero.py --stock /tmp/stock_vendor_boot.img --tree ~/fox_${{ github.event.inputs.manifest_branch }}/device/volla/algiz
          fi

      - name: Compile OrangeFox Recovery for Volla Quintus (algiz)
        run: |
          cd ~/fox_${{ github.event.inputs.manifest_branch }}
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=algiz
          lunch twrp_algiz-eng
          mka adbd vendorbootimage

      - name: Upload Built OrangeFox Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-algiz-Kernel-6.6
          path: |
            ~/fox_${{ github.event.inputs.manifest_branch }}/out/target/product/algiz/OrangeFox*.zip
            ~/fox_${{ github.event.inputs.manifest_branch }}/out/target/product/algiz/vendor_boot.img
